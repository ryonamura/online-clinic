name: Deploy to GitHub Pages

on:
  push:
    branches: [damascus, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (with GitHub Pages base path)
        run: npm run build
        env:
          PUBLIC_SITE: https://ryonamura.github.io
          PUBLIC_BASE: /online-clinic
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # デプロイは既定ブランチ main のみ（github-pages 環境の保護ルールに準拠）。
    # damascus / PR では build 検証のみ行い、deploy はスキップする。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
